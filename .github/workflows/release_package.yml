# Publishes the version already committed in package.json. Version bumps land on main through a
# pull request, because main is protected and this workflow cannot push to it.
name: Release package
on:
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
          node-version: '22'

      - name: Read version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) NPM_TAG=beta; PRERELEASE=true ;;
            *) NPM_TAG=latest; PRERELEASE=false ;;
          esac
          {
            echo "VERSION=$VERSION"
            echo "NPM_TAG=$NPM_TAG"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"

      # The podspec fetches its sources from the tag named exactly after the version.
      - name: Refuse an already released version
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists. Bump the version in package.json through a pull request."
            exit 1
          fi
          if npm view "terra-capacitor@$VERSION" version > /dev/null 2>&1; then
            echo "::error::terra-capacitor@$VERSION is already on npm. Bump the version in package.json through a pull request."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_ACCESS_TOKEN }}

      - name: Tag and create GitHub release
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ github.token }}
